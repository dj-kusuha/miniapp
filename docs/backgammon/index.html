<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>バックギャモン</title>
<meta name="description" content="勝敗だけを報酬に自己対局で学習したニューラルネットと対戦できるバックギャモン。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🎲</text></svg>">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="site-header">
  <a class="back-link" href="../">← miniapp</a>
  <h1>バックギャモン</h1>
</header>

<main id="app">
  <section id="setup" class="panel">
    <h2>対局を始める</h2>
    <div class="field">
      <span id="level-label">AI の強さ</span>
      <div class="choices" role="radiogroup" aria-labelledby="level-label">
        <button type="button" class="choice" data-plies="0" role="radio" aria-checked="false">ふつう（0-ply）</button>
        <button type="button" class="choice is-selected" data-plies="2" role="radio" aria-checked="true">つよい（2-ply）</button>
        <button type="button" class="choice" data-plies="3" role="radio" aria-checked="false">めちゃつよ（3-ply）</button>
      </div>
    </div>
    <div class="field">
      <span id="cube-label">ダブリングキューブ</span>
      <div class="choices" role="radiogroup" aria-labelledby="cube-label">
        <button type="button" class="choice is-selected" data-cube="on" role="radio" aria-checked="true">使う</button>
        <button type="button" class="choice" data-cube="off" role="radio" aria-checked="false">使わない</button>
      </div>
    </div>
    <div class="field" id="jacoby-field">
      <span id="jacoby-label">ジャコビールール</span>
      <div class="choices" role="radiogroup" aria-labelledby="jacoby-label">
        <button type="button" class="choice is-selected" data-jacoby="on" role="radio" aria-checked="true">あり</button>
        <button type="button" class="choice" data-jacoby="off" role="radio" aria-checked="false">なし</button>
      </div>
      <p class="note">キューブが一度も回されていない局は、ギャモン・バックギャモンでも 1 点。</p>
    </div>
    <div class="field">
      <span id="model-label">対戦相手のモデル</span>
      <p id="model-info" class="note">読み込み中…</p>
    </div>
    <p id="loading" class="note">モデルを読み込んでいます…</p>
    <button type="button" id="start" class="primary" disabled>開始</button>
  </section>

  <section id="game" hidden>
    <div class="play">
      <div id="board" class="board" role="grid" aria-label="盤面">
        <div id="dice-ai" class="dice" aria-live="polite" aria-label="AI の出目"></div>
        <div id="dice" class="dice" aria-live="polite" aria-label="あなたの出目"></div>
        <button type="button" id="roll" class="primary" hidden>サイコロを振る</button>
        <button type="button" id="double" class="cube-action" hidden>ダブル</button>
      </div>

      <div class="panel status-panel">
        <p id="turn" class="turn" aria-live="polite">—</p>
        <p id="cube-state" class="cube-state" aria-live="polite" hidden></p>
        <p id="hint" class="note"></p>
      </div>

      <div class="actions">
        <button type="button" id="take" class="primary" hidden>テイク</button>
        <button type="button" id="pass" hidden>パス</button>
        <button type="button" id="undo" hidden>1 手戻す</button>
        <button type="button" id="again" class="primary" hidden>もう一局</button>
      </div>
    </div>

    <div class="panel speed-panel">
      <div class="speed-head">
        <label for="speed">AI の間合い</label>
        <output id="speed-value" for="speed">1.0 秒</output>
      </div>
      <input type="range" id="speed" min="0.1" max="2" step="0.1" value="1"
             aria-describedby="speed-note">
      <p id="speed-note" class="note">AI が駒を 1 個動かすたびの間と、出目を見せる時間。</p>
    </div>

    <details id="record" class="panel record">
      <summary>棋譜</summary>
      <ol id="log" class="log"></ol>
      <div class="record-export">
        <div class="record-head">
          <h3>gnubg 用（.mat）</h3>
          <button type="button" id="copy-mat">コピー</button>
        </div>
        <pre id="mat" class="mat"></pre>
      </div>
    </details>
  </section>
</main>

<script type="module" src="./app.js"></script>
</body>
</html>
